sources:
  - name: jaffle_shop
    description: "The source data for the jaffle shop."
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: "Raw data for customers."
        columns:
          - name: id
            description: "The primary key for this table."
            data_tests:
              - unique
              - not_null
      - name: orders
        description: "Raw data for orders."
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour